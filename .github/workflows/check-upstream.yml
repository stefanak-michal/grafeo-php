name: Check Upstream & Auto-Release

on:
  schedule:
    - cron: '0 8 * * *' # Runs every day at 08:00 UTC
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  auto-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit version bumps and create releases
      issues: write   # Required to open issues if headers change

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check and Process Upstream
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            // 1. Get latest release from upstream Grafeo repo
            const upstreamResponse = await github.rest.repos.getLatestRelease({
              owner: 'GrafeoDB',
              repo: 'grafeo'
            });
            const upstreamTag = upstreamResponse.data.tag_name;
            console.log(`Latest upstream Grafeo version: ${upstreamTag}`);

            // 2. Get latest release of your PHP wrapper repo
            let currentTag;
            try {
              const currentResponse = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              currentTag = currentResponse.data.tag_name;
            } catch (error) {
              console.log("No releases found in your wrapper repository yet. Skipping automated sync.");
              return;
            }
            console.log(`Latest local wrapper/baseline version: ${currentTag}`);

            if (upstreamTag === currentTag) {
              console.log("Wrapper is already synchronized with the latest upstream release tag.");
              return;
            }

            // 3. Download headers for comparison
            const newHeaderUrl = `https://raw.githubusercontent.com/GrafeoDB/grafeo/${upstreamTag}/crates/bindings/c/grafeo.h`;
            const newRes = await fetch(newHeaderUrl);
            if (!newRes.ok) {
              console.log(`Failed to fetch new header: HTTP ${newRes.status}`);
              return;
            }
            fs.writeFileSync('new_grafeo.h', await newRes.text());

            const oldHeaderUrl = `https://raw.githubusercontent.com/GrafeoDB/grafeo/${currentTag}/crates/bindings/c/grafeo.h`;
            const oldRes = await fetch(oldHeaderUrl);
            if (!oldRes.ok) {
              console.log(`Failed to fetch baseline header for tag ${currentTag}`);
              return;
            }
            fs.writeFileSync('old_grafeo.h', await oldRes.text());

            // 4. Compare headers using git diff
            let diffOutput = '';
            let hasChanges = false;
            try {
              execSync('git diff --no-index --exit-code old_grafeo.h new_grafeo.h');
            } catch (err) {
              hasChanges = true;
              diffOutput = err.stdout ? err.stdout.toString() : '';
            }

            // --- SCENARIO A: HEADERS CHANGED (Requires human attention) ---
            if (hasChanges) {
              console.log("Header changes detected! Creating notification issue.");

              const issueTitle = `⚠️ Grafeo C API Header Changed (${currentTag} -> ${upstreamTag})`;
              if (diffOutput.length > 60000) {
                diffOutput = diffOutput.substring(0, 60000) + "\n\n...[Diff truncated due to length]...";
              }

              // Deduplicate issues
              const existingIssues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                filter: 'all'
              });

              if (!existingIssues.data.some(issue => issue.title === issueTitle)) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueTitle,
                  body: `A new upstream Grafeo version (**${upstreamTag}**) has breaking or modifying changes in \`grafeo.h\` compared to (**${currentTag}**).\n\n` +
                    `### C API Diff:\n\`\`\`diff\n${diffOutput}\n\`\`\`\n\n` +
                    `### Action Items:\n` +
                    `1. Update \`src/Grafeo.php\` to reflect the signature changes.\n` +
                    `2. Update your workflow reference version tag, verify tests pass, and release.`
                });
              }
            } 
            // --- SCENARIO B: NO HEADER CHANGES (Safe to auto-bump and auto-release) ---
            else {
              console.log("No header changes detected. Performing automated version bump and release!");

              // Path to your main phpunit workflow file where the version tag is defined
              const workflowPath = '.github/workflows/phpunit.yml'; 
              if (fs.existsSync(workflowPath)) {
                let workflowContent = fs.readFileSync(workflowPath, 'utf8');
                
                // Replace the old tag with the new upstream tag inside your workflow file
                // (Assuming your workflow uses something like ref: v0.5.44 or GRAFEO_VERSION="v0.5.44")
                workflowContent = workflowContent.replaceAll(currentTag, upstreamTag);
                fs.writeFileSync(workflowPath, workflowContent, 'utf8');

                // Commit the workflow version update
                execSync(`git add ${workflowPath}`);
                execSync(`git commit -m "chore: bump Grafeo core version to ${upstreamTag}"`);
                execSync('git push origin HEAD');
                console.log("Successfully pushed workflow version bump to repository.");
              }

              // Create a matching GitHub Release on your PHP wrapper repo
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: upstreamTag,
                name: upstreamTag,
                body: `Automated release aligning with Grafeo core version ${upstreamTag}. C API headers are identical to the previous release.`
              });
              console.log(`Successfully created new release: ${upstreamTag}`);
            }

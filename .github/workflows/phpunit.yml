name: PHPUnit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download and Extract Grafeo C Library
        run: |
          mkdir -p target/release
          GRAFEO_VERSION="v0.5.44" # Match your desired version tag
          URL="https://github.com/GrafeoDB/grafeo/releases/download/${GRAFEO_VERSION}/grafeo-${GRAFEO_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          
          echo "Downloading from $URL..."
          curl -L -o grafeo.tar.gz "$URL"
          
          echo "Extracting archive..."
          tar -xzf grafeo.tar.gz
          
          # Move or find the .so file and put it into target/release/
          # (Adjust the path below if the tarball structure places it inside a subfolder)
          find . -name "libgrafeo_c.so" -exec cp {} target/release/ \;

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ffi

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        env:
          GRAFEO_LIB_PATH: ${{ github.workspace }}/target/release/libgrafeo_c.so
        run: vendor/bin/phpunit test --colors=always

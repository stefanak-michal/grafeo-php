name: PHPUnit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Grafeo Core Source
        uses: actions/checkout@v4
        with:
          repository: GrafeoDB/grafeo
          ref: v0.5.44
          path: grafeo-core

      - name: Build Grafeo C Library via Docker with Full Features
        run: |
          docker run --rm -v "${{ github.workspace }}/grafeo-core:/usr/src/myapp" -w /usr/src/myapp rust:latest cargo build --release -p grafeo-c --features full
          
          mkdir -p target/release
          cp grafeo-core/target/release/libgrafeo_c.so target/release/libgrafeo_c.so

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ffi

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        env:
          GRAFEO_LIB_PATH: ${{ github.workspace }}/target/release/libgrafeo_c.so
        run: vendor/bin/phpunit test --colors=always
